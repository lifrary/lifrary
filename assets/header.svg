<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="304" viewBox="0 0 1120 304" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Seungwoo Lee — AI-native engineer</title>
  <desc id="desc">From research to real-world systems. Co-founder at SECA, Seoul. A dark navy banner with a mint-accented network connecting research, engineering, and product.</desc>
  <defs>
