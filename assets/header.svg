      <stop stop-color="#0B1220" />
      <stop offset="1" stop-color="#142638" />
    </linearGradient>
    <linearGradient id="connection" x1="772" y1="218" x2="1024" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#397D91" />
      <stop offset="1" stop-color="#80E8CE" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B1C4D6" fill-opacity="0.1" />
